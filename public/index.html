<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animeshon - Otakudesu Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #global-loader { transition: opacity 0.3s ease-in-out; }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="antialiased selection:bg-purple-500 selection:text-white pb-10">

    <div id="global-loader" class="fixed inset-0 bg-[#0b0f19] z-[100] flex flex-col justify-center items-center">
        <div class="loader-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-purple-500 mb-4"></div>
        <p class="text-purple-400 font-bold tracking-widest animate-pulse">ANIMESHON</p>
    </div>

    <!-- Navbar -->
    <nav class="bg-[#0b0f19]/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="#home" class="flex items-center space-x-2">
                        <i class="fas fa-play text-purple-500 text-xl"></i>
                        <h1 class="text-xl font-bold tracking-tight text-white">animeshon</h1>
                    </a>
                    <div class="hidden lg:flex space-x-6">
                        <a href="#home" class="text-gray-400 hover:text-white font-medium text-sm transition-colors">Beranda</a>
                        <a href="#animelist" class="text-gray-400 hover:text-white font-medium text-sm transition-colors">Anime</a>
                        <a href="#ongoing" class="text-gray-400 hover:text-white font-medium text-sm transition-colors">Ongoing</a>
                        <a href="#jadwal" class="text-gray-400 hover:text-white font-medium text-sm transition-colors">Jadwal</a>
                        <a href="#genres" class="text-gray-400 hover:text-white font-medium text-sm transition-colors">Genre</a>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-6 flex-1 justify-end">
                    <form id="search-form" class="relative w-full max-w-md">
                        <i class="fas fa-search absolute left-3 top-2.5 text-gray-500 text-sm"></i>
                        <input type="text" id="search-input" placeholder="Cari anime (contoh: boruto)..." class="w-full bg-[#1a1f2e] border border-gray-700 text-sm rounded-full pl-10 pr-4 py-2 focus:outline-none focus:border-purple-500 text-white">
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div id="app-container" class="min-h-screen"></div>

    <script>
        const BASE_PROXY = '/api/proxy?endpoint=';
        const API = {
            HOME: '/anime/home',
            SCHEDULE: '/anime/schedule',
            DETAIL: '/anime/anime/', 
            EPISODE: '/anime/episode/', 
            ONGOING: '/anime/ongoing-anime',
            COMPLETE: '/anime/complete-anime',
            GENRES: '/anime/genre',
            GENRE_DETAIL: '/anime/genre/',
            SEARCH: '/anime/search/',
            ANIMELIST: '/anime/unlimited'
        };

        const appContainer = document.getElementById('app-container');
        const globalLoader = document.getElementById('global-loader');

        function showLoader() { globalLoader.classList.remove('fade-out'); }
        function hideLoader() { globalLoader.classList.add('fade-out'); }

        const errorHTML = (msg) => `
            <div class="text-center py-32 px-4">
                <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                <h3 class="text-xl font-bold text-white mb-2">Terjadi Kesalahan</h3>
                <p class="text-gray-400 mb-6">${msg}</p>
                <button onclick="router()" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg">Coba Lagi</button>
            </div>
        `;

        function extractData(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data;
            if (typeof data === 'object') {
                const keys = ['data', 'result', 'anime_list', 'ongoing_anime', 'complete_anime', 'anime', 'episode_list', 'episodes', 'list'];
                for (let k of keys) {
                    if (Array.isArray(data[k])) return data[k];
                }
            }
            return [];
        }

        function extractSlug(item) {
            if (!item) return '';
            let slug = item.endpoint || item.slug || item.id || '';
            
            if (slug) {
                slug = slug.replace('/anime/', '').replace('/episode/', '').replace(/^\/+|\/+$/g, '');
                return slug;
            }

            for (let key in item) {
                if (typeof item[key] === 'string' && item[key].includes('-') && !item[key].includes(' ') && !item[key].startsWith('http')) {
                    return item[key].replace(/^\/+|\/+$/g, '');
                }
            }
            return '';
        }

        function generateAnimeCards(animeList) {
            if (!animeList || animeList.length === 0) return `<div class="col-span-full py-10 text-center text-gray-500">Tidak ada data.</div>`;
            
            return animeList.map(anime => {
                const title = anime.judul || anime.title || anime.name || 'Unknown Title';
                const image = anime.thumb || anime.thumbnail || anime.image || anime.poster || 'https://via.placeholder.com/300x450';
                
                let badgeText = anime.episode || anime.eps || anime.status || '';
                
                const slug = extractSlug(anime);
                const isEps = slug.includes('episode') || slug.includes('eps');
                const targetHash = isEps ? `#episode/${slug}` : `#detail/${slug}`;

                return `
                    <a href="${targetHash}" class="block group">
                        <div class="relative aspect-[3/4] rounded-lg overflow-hidden bg-[#1a1f2e] mb-2 border border-gray-800 card-hover">
                            <img src="${image}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                            ${badgeText ? `<div class="absolute top-2 left-2 bg-gray-900/90 text-white text-[10px] font-bold px-2 py-0.5 rounded">${badgeText}</div>` : ''}
                        </div>
                        <h4 class="font-semibold text-sm line-clamp-2 text-gray-200 group-hover:text-purple-400">${title}</h4>
                    </a>
                `;
            }).join('');
        }

        async function router() {
            const hash = window.location.hash || '#home';
            showLoader();
            window.scrollTo(0, 0);

            try {
                if (hash === '#home') await renderHome();
                else if (hash.startsWith('#detail/')) await renderDetail(hash.replace('#detail/', ''));
                else if (hash.startsWith('#episode/')) await renderWatch(hash.replace('#episode/', ''));
                else if (hash === '#ongoing') await renderList(API.ONGOING, "Anime Sedang Tayang (Ongoing)");
                else if (hash === '#jadwal') await renderSchedule();
                else if (hash === '#animelist') await renderList(API.ANIMELIST, "Semua Anime");
                else if (hash === '#genres') await renderGenres();
                else if (hash.startsWith('#genre/')) await renderList(API.GENRE_DETAIL + hash.replace('#genre/', ''), "Kategori Genre");
                else if (hash.startsWith('#search/')) await renderList(API.SEARCH + hash.replace('#search/', ''), "Hasil Pencarian");
                else await renderHome();
            } catch (error) {
                console.error(error);
                appContainer.innerHTML = errorHTML("Gagal menarik data dari API. Pastikan endpoint Otakudesu aktif.");
            } finally {
                hideLoader();
            }
        }

        async function renderHome() {
            const res = await fetch(BASE_PROXY + API.HOME);
            const json = await res.json();
            const rootData = json.data || json.result || json || {};
            
            let ongoing = rootData.ongoing_anime || rootData.on_going || [];
            let completed = rootData.complete_anime || rootData.completed || [];

            appContainer.innerHTML = `
                <div class="max-w-[1400px] mx-auto px-4 py-10 flex flex-col lg:flex-row gap-8">
                    <div class="flex-1 w-full">
                        <div class="mb-12">
                            <h2 class="text-xl font-bold text-white border-l-4 border-purple-500 pl-3 mb-6">Ongoing (Sedang Tayang)</h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                ${generateAnimeCards(ongoing)}
                            </div>
                        </div>
                        <div class="mb-6">
                            <h2 class="text-xl font-bold text-white border-l-4 border-purple-500 pl-3 mb-6">Complete (Tamat)</h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                ${generateAnimeCards(completed)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function renderDetail(slug) {
            const res = await fetch(BASE_PROXY + API.DETAIL + slug);
            const json = await res.json();
            const info = json.data || json.result || json;
            
            const title = info.judul || info.title || info.name || 'Detail Anime';
            const image = info.thumb || info.thumbnail || info.image || info.poster || '';
            const synopsis = info.sinopsis || info.synopsis || '-';
            const episodes = extractData(info.episode_list || info.episodes || info);

            let html = `
                <div class="max-w-[1400px] mx-auto px-4 py-8">
                    <button onclick="window.history.back()" class="text-gray-400 hover:text-white mb-6 bg-[#1a1f2e] px-4 py-2 rounded-lg text-sm border border-gray-800">&larr; Kembali</button>
                    <div class="flex flex-col md:flex-row gap-8 bg-[#1a1f2e] p-6 rounded-xl border border-gray-800">
                        <div class="w-full md:w-64 flex-shrink-0">
                            <img src="${image}" class="w-full rounded-lg shadow-lg" alt="${title}">
                            <div class="mt-4 bg-gray-900/80 p-3 rounded text-center">
                                <p class="text-xs text-gray-500">Status</p>
                                <p class="font-bold text-purple-400">${info.status || 'Unknown'}</p>
                            </div>
                        </div>
                        <div class="flex-1">
                            <h1 class="text-3xl font-bold text-white mb-4">${title}</h1>
                            <p class="text-sm text-gray-400 leading-relaxed mb-8 bg-gray-900/50 p-4 rounded">${synopsis}</p>
                            
                            <h3 class="text-sm font-bold text-gray-300 mb-4 border-b border-gray-800 pb-2">Daftar Episode</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 max-h-72 overflow-y-auto">
            `;

            if(episodes.length > 0) {
                episodes.forEach(eps => {
                    let epSlug = extractSlug(eps);
                    let epTitle = eps.judul || eps.title || eps.episode || 'Eps';
                    html += `<a href="#episode/${epSlug}" class="py-2 bg-gray-800 hover:bg-purple-600 text-center text-gray-300 hover:text-white rounded text-xs font-semibold truncate px-2">${epTitle}</a>`;
                });
            } else {
                html += `<div class="col-span-full text-center text-gray-500">Episode belum tersedia.</div>`;
            }

            html += `</div></div></div></div>`;
            appContainer.innerHTML = html;
        }

        async function renderWatch(slug) {
            const res = await fetch(BASE_PROXY + API.EPISODE + slug);
            const json = await res.json();
            const info = json.data || json.result || json || {};
            
            let streamUrl = info.stream_url || info.video || info.iframe || info.link_stream || '';
            
            if (!streamUrl && info.server && Array.isArray(info.server)) {
                const server = info.server.find(s => s.url || s.iframe);
                if (server) streamUrl = server.url || server.iframe;
            }

            appContainer.innerHTML = `
                <div class="max-w-[1200px] mx-auto px-4 py-8">
                    <button onclick="window.history.back()" class="text-gray-400 hover:text-white mb-6 bg-[#1a1f2e] px-4 py-2 rounded-lg text-sm border border-gray-800">&larr; Kembali</button>
                    <h2 class="text-2xl font-bold text-white mb-6 border-l-4 border-purple-500 pl-3">${info.judul || info.title || 'Streaming Anime'}</h2>
                    
                    <div class="aspect-video bg-black rounded-xl overflow-hidden border border-gray-800 flex items-center justify-center">
                        ${streamUrl ? `<iframe src="${streamUrl}" class="w-full h-full" allowfullscreen="true" frameborder="0"></iframe>` 
                        : `<p class="text-gray-500"><i class="fas fa-video-slash text-4xl block text-center mb-2"></i>Sumber video tidak ditemukan.</p>`}
                    </div>
                </div>
            `;
        }

        async function renderSchedule() {
            const res = await fetch(BASE_PROXY + API.SCHEDULE);
            const json = await res.json();
            const schedData = json.data || json.result || json || [];

            let html = `<div class="max-w-[1400px] mx-auto px-4 py-10"><h2 class="text-2xl font-bold text-white mb-8 border-l-4 border-purple-500 pl-3">Jadwal Rilis Mingguan</h2><div class="space-y-10">`;
            
            let daysArray = [];
            
            if (Array.isArray(schedData)) {
                daysArray = schedData;
            } else if (typeof schedData === 'object' && schedData !== null) {
                daysArray = Object.keys(schedData).map(key => ({ 
                    day: key, 
                    anime_list: schedData[key] 
                }));
            }

            if (daysArray.length > 0) {
                daysArray.forEach(dayInfo => {
                    let dayName = dayInfo.day || dayInfo.hari || 'Unknown Day';
                    let animeList = dayInfo.anime_list || dayInfo.animeList || dayInfo.anime || []; 
                    
                    if (animeList.length > 0) {
                        html += `
                            <div class="bg-[#1a1f2e] rounded-xl p-6 border border-gray-800">
                                <h3 class="text-lg font-bold text-purple-400 mb-6 uppercase border-b border-gray-800 pb-2">${dayName}</h3>
                                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                    ${generateAnimeCards(animeList)}
                                </div>
                            </div>
                        `;
                    }
                });
            } else {
                html += `<div class="text-gray-500 py-10 text-center w-full">Data jadwal saat ini tidak tersedia dari server.</div>`;
            }
            
            html += `</div></div>`;
            appContainer.innerHTML = html;
        }

        async function renderGenres() {
            const res = await fetch(BASE_PROXY + API.GENRES);
            const json = await res.json();
            const genres = extractData(json);
            
            let html = `<div class="max-w-[1400px] mx-auto px-4 py-10"><h2 class="text-2xl font-bold text-white mb-8 border-l-4 border-purple-500 pl-3">Semua Genre</h2><div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">`;
            
            genres.forEach(g => {
                let name = g.nama || g.title || g.name || g;
                let slug = extractSlug(g) || (typeof name === 'string' ? name.toLowerCase().replace(/ /g, '-') : '');
                
                if (name) {
                    html += `<a href="#genre/${slug}" class="bg-[#1a1f2e] hover:bg-purple-600 text-center py-4 rounded-xl border border-gray-800 font-semibold text-gray-300 hover:text-white">${name}</a>`;
                }
            });
            
            html += `</div></div>`;
            appContainer.innerHTML = html;
        }

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('search-input').value.trim();
            if(val) window.location.hash = `#search/${val}`;
        });

        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', router);
    </script>
</body>
</html>
