<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animeshon - Streaming Anime Elegan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a; /* slate-900 */
            color: #e2e8f0;
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.4);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-blue-500 selection:text-white">
    
    <!-- Navbar -->
    <nav class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-600">ANIMESHON</h1>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-6">
                        <a href="#" class="text-blue-400 hover:text-blue-300 font-semibold text-sm transition-colors">Beranda</a>
                        <a href="#" class="text-slate-400 hover:text-white font-medium text-sm transition-colors">Jadwal Rilis</a>
                        <a href="#" class="text-slate-400 hover:text-white font-medium text-sm transition-colors">Daftar Anime</a>
                    </div>
                </div>
                <!-- Mobile menu button -->
                <div class="md:hidden flex items-center">
                    <button class="text-slate-400 hover:text-white focus:outline-none">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative overflow-hidden bg-slate-900 py-16 sm:py-24">
        <div class="absolute inset-0 bg-blue-900/10 rounded-full blur-3xl transform -translate-y-1/2 scale-150"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h2 class="text-4xl tracking-tight font-extrabold sm:text-5xl md:text-6xl text-white drop-shadow-lg">
                Portal Anime <span class="text-blue-500">Premium</span>
            </h2>
            <p class="mt-4 max-w-2xl mx-auto text-lg text-slate-400">
                Streaming dan nikmati update anime terbaru dengan antarmuka elegan, ringan, dan responsif.
            </p>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 min-h-screen">
        <div class="flex justify-between items-end mb-8 border-b border-slate-800 pb-4">
            <h3 class="text-2xl font-bold border-l-4 border-blue-500 pl-3">Update Terbaru</h3>
        </div>

        <!-- Loader -->
        <div id="loader" class="flex flex-col justify-center items-center py-32">
            <div class="animate-spin rounded-full h-14 w-14 border-t-2 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-slate-500 animate-pulse">Menghubungkan ke server...</p>
        </div>

        <!-- Anime Grid -->
        <div id="anime-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6 hidden">
            <!-- Card Injeksi JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-900 mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-xl font-bold text-slate-700 mb-2">ANIMESHON</h1>
            <p class="text-sm text-slate-500">&copy; 2026 Animeshon Web. Powered by Vercel Edge Cache.</p>
        </div>
    </footer>

    <!-- Script Utama -->
    <script>
        async function fetchAnime() {
            try {
                // Memanggil fungsi serverless Vercel proxy kita
                const response = await fetch('/api/proxy');
                const data = await response.json();

                // Memunculkan data asli di Console browser untuk pengecekan
                console.log("Data Response Asli:", data);

                document.getElementById('loader').classList.add('hidden');
                const grid = document.getElementById('anime-grid');
                grid.classList.remove('hidden');

                // Fungsi pelacak otomatis: Mencari array anime tersembunyi di dalam struktur JSON
                function findAnimeArray(obj) {
                    if (Array.isArray(obj) && obj.length > 0) return obj;
                    if (typeof obj === 'object' && obj !== null) {
                        for (let key in obj) {
                            if (Array.isArray(obj[key]) && obj[key].length > 0) return obj[key];
                            if (typeof obj[key] === 'object') {
                                let found = findAnimeArray(obj[key]);
                                if (found && found.length > 0) return found;
                            }
                        }
                    }
                    return [];
                }

                const animeList = findAnimeArray(data);

                if (animeList.length > 0) {
                    grid.innerHTML = animeList.map(anime => {
                        // Deteksi nama variabel untuk gambar dan judul sesuai format API
                        const title = anime.title || anime.name || 'Unknown Title';
                        const image = anime.image || anime.thumbnail || anime.poster || anime.cover || 'https://via.placeholder.com/300x450?text=No+Cover';
                        const status = anime.status || anime.type || 'Ongoing';
                        const eps = anime.episode || anime.eps || '';
                        const linkId = anime.id || anime.endpoint || '#';

                        return `
                            <a href="#detail-${linkId}" class="block bg-slate-800/50 rounded-xl overflow-hidden shadow-lg border border-slate-700/50 transition-all duration-300 card-hover group">
                                <div class="relative aspect-[3/4] overflow-hidden bg-slate-800">
                                    <img src="${image}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-110 group-hover:rotate-1 transition-transform duration-700">
                                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent opacity-90"></div>
                                    <div class="absolute bottom-0 left-0 right-0 p-4">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="inline-flex items-center px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-blue-600/90 text-white backdrop-blur-sm">
                                                ${status}
                                            </span>
                                            ${eps ? `<span class="text-xs font-medium text-slate-300 bg-black/50 px-2 py-1 rounded backdrop-blur-sm">${eps}</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="absolute inset-0 bg-blue-600/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                                        <div class="bg-white/20 backdrop-blur-md rounded-full p-3 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">
                                            <svg class="w-6 h-6 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                        </div>
                                    </div>
                                </div>
                                <div class="p-4">
                                    <h4 class="font-bold text-sm leading-tight line-clamp-2 text-slate-200 group-hover:text-blue-400 transition-colors">${title}</h4>
                                </div>
                            </a>
                        `;
                    }).join('');
                } else {
                    grid.innerHTML = `
                        <div class="col-span-full py-10 text-center">
                            <p class="text-slate-400">Data array tidak ditemukan dalam JSON. Buka Console browser (F12) untuk mengecek struktur aslinya.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                document.getElementById('loader').innerHTML = `
                    <div class="text-center">
                        <p class="text-red-400 font-medium mb-2">Gagal mengambil data dari server.</p>
                        <button onclick="location.reload()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-md transition-colors">Coba Lagi</button>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchAnime);
    </script>
</body>
</html>
