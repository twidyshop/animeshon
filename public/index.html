<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TLIBRARY — Streaming</title>
<style>
:root{--bg:#050609;--panel:#0d1017;--panel2:#151923;--line:#252b38;--text:#f5f7fb;--muted:#98a0b2;--accent:#8b6cff;--max:1440px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.nav{position:sticky;top:0;z-index:30;background:#050609d9;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff08}.navin{height:68px;max-width:var(--max);margin:auto;padding:0 22px;display:flex;align-items:center;gap:24px}.logo{font-size:22px;font-weight:950;letter-spacing:.08em}.logo span{color:#a994ff}.links{display:flex;gap:20px}.links button{border:0;background:none;color:#c8cedb}.search{margin-left:auto;display:flex;width:min(360px,40vw);background:#11151e;border:1px solid var(--line);border-radius:12px;padding:0 12px}.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;padding:10px}.hero{min-height:590px;position:relative;display:flex;align-items:end;background:radial-gradient(circle at 70% 25%,#6d4cff2b,transparent 30%),linear-gradient(90deg,#050609 0%,#050609e8 28%,#05060944 70%,#050609 100%),linear-gradient(0deg,#050609,transparent 42%),url('https://image.tmdb.org/t/p/original/8PqY3VwR3q8X9mL7k1pX0r5n4s.jpg') center/cover}.heroin{width:100%;max-width:var(--max);margin:auto;padding:70px 22px}.kicker{color:#a994ff;font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,82px);line-height:.96;max-width:800px;margin:12px 0}.hero p{max-width:640px;color:#c0c7d4;font-size:17px}.actions{display:flex;gap:10px;margin-top:24px}.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:850}.primary{background:#fff;color:#050609}.dark{background:#202632;color:#fff}.wrap{max-width:var(--max);margin:auto;padding:30px 22px 80px}.section{margin:36px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sectionhead h2{font-size:22px;margin:0}.sectionhead small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.card{min-width:0;cursor:pointer}.poster{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#10141c;border:1px solid #1d2330}.poster img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .25s}.card:hover .poster img{transform:scale(1.035)}.ct{padding:9px 2px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px}.star{color:#f7c95d}.loading,.empty{padding:45px 10px;color:var(--muted)}.pages{display:flex;justify-content:center;gap:7px;margin-top:28px}.pages button{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:8px;padding:9px 13px}.drawer{position:fixed;inset:0;z-index:60;background:#050609;overflow:auto;display:none}.drawer.open{display:block}.backdrop{height:58vh;min-height:350px;position:relative;background:center/cover no-repeat}.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#050609,transparent 65%),linear-gradient(90deg,#050609aa,transparent)}.x{position:absolute;right:20px;top:18px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff18;background:#0d1017e8;color:#fff}.detail{max-width:1200px;margin:-120px auto 0;padding:0 22px 80px;position:relative}.detail h1{font-size:clamp(36px,6vw,68px);line-height:1;margin:8px 0 13px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#11151e;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:#cbd1dc}.syn{max-width:850px;color:#c1c7d2;font-size:16px}.seasons{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.season{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:9px;padding:9px 13px;white-space:nowrap}.season.active{background:#fff;color:#050609}.episodes{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.episode{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:10px;padding:13px;text-align:left}.episode strong{display:block}.episode span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.cast{display:flex;gap:12px;overflow:auto}.person{flex:0 0 100px;width:100px}.person img{width:100px;height:145px;object-fit:cover;border-radius:8px;background:var(--panel2)}.person b{display:block;font-size:12px;margin-top:6px}.person small{display:block;color:var(--muted);font-size:11px}.player{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}.player.open{display:flex}.playerbox{width:min(1100px,96vw);position:relative}.playerbox iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:10px}.playerbox .x{top:-52px}.notice{padding:15px;background:#10131a;color:#b9c0ce}.source{margin-top:10px;color:#8f98aa;font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 15px;border-radius:10px;z-index:200;display:none}.toast.show{display:block}@media(max-width:1050px){.grid{grid-template-columns:repeat(5,1fr)}.episodes{grid-template-columns:repeat(4,1fr)}}@media(max-width:720px){.navin{height:62px;padding:0 14px}.links{display:none}.search{width:auto;max-width:220px}.hero{min-height:510px}.heroin{padding:55px 15px}.wrap{padding:24px 14px 60px}.grid{grid-template-columns:repeat(3,1fr);gap:12px}.backdrop{height:45vh;min-height:300px}.detail{margin:-70px auto 0;padding:0 15px 55px}.episodes{grid-template-columns:repeat(2,1fr)}.hero p{font-size:15px}}
</style><script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script></head>
<body>
<header class="nav"><div class="navin"><div class="logo">T<span>LIBRARY</span></div><div class="links"><button onclick="home()">Beranda</button><button onclick="loadList('movie')">Film</button><button onclick="loadList('tv')">Series</button></div><form class="search" onsubmit="doSearch(event)"><span>⌕</span><input id="q" placeholder="Cari film atau series…"></form></div></header>
<section class="hero"><div class="heroin"><div class="kicker">TLIBRARY STREAMING</div><h1>Temukan tontonan berikutnya.</h1><p>Katalog film dan series yang diperbarui secara dinamis, lengkap dengan halaman detail, season, episode, cast, pencarian, dan riwayat tontonan.</p><div class="actions"><button class="btn primary" onclick="loadList('movie')">Jelajahi Film</button><button class="btn dark" onclick="loadList('tv')">Lihat Series</button></div></div></section>
<main class="wrap"><section class="section"><div class="sectionhead"><h2 id="sectionTitle">Pilihan Terbaru</h2><small id="count"></small></div><div id="grid" class="grid"><div class="loading">Memuat katalog…</div></div><div id="pages" class="pages"></div></section></main>
<div id="drawer" class="drawer"><div id="backdrop" class="backdrop"><button class="x" onclick="closeDetail()">✕</button></div><div class="detail" id="detail"></div></div>
<div id="player" class="player"><div class="playerbox"><button class="x" onclick="closePlayer()">✕</button><video id="playerVideo" controls playsinline style="width:100%;aspect-ratio:16/9;background:#000;border-radius:10px"></video><iframe id="playerFrame" title="VeloFlix Player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display:none"></iframe></div></div>

<div id="toast" class="toast"></div>
<script>
const API='/api';let page=1,type='movie',current=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u){const r=await fetch(u);const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Request gagal');return d}
function card(x){return `<article class="card" onclick="detail('${x.type}','${x.id}')"><div class="poster">${x.image?`<img loading="lazy" src="${esc(x.image)}" alt="${esc(x.title)}">`:''}</div><div class="ct"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.year)} ${x.rating?` · <span class="star">★ ${esc(x.rating)}</span>`:''}</div></div></article>`}
function render(items){document.getElementById('grid').innerHTML=items?.length?items.map(card).join(''):'<div class="empty">Tidak ada hasil.</div>'}
async function home(){document.getElementById('grid').innerHTML='<div class="loading">Memuat…</div>';document.getElementById('pages').innerHTML='';try{const d=await api(API+'/home');render(d.items);document.getElementById('sectionTitle').textContent='Pilihan Terbaru';document.getElementById('count').textContent='Dinamis'}catch(e){fail(e)}}
async function loadList(t='movie',p=1){type=t;page=p;document.getElementById('grid').innerHTML='<div class="loading">Memuat…</div>';try{const d=await api(`${API}/list?type=${t}&page=${p}`);render(d.items);document.getElementById('sectionTitle').textContent=t==='tv'?'Series':'Film';document.getElementById('count').textContent=`Halaman ${p}`;document.getElementById('pages').innerHTML=`<button onclick="loadList('${t}',${Math.max(1,p-1)})">‹</button><button>${p}</button><button onclick="loadList('${t}',${p+1})">›</button>`;scrollTo({top:500,behavior:'smooth'})}catch(e){fail(e)}}
async function doSearch(e){e.preventDefault();const q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('grid').innerHTML='<div class="loading">Mencari…</div>';try{const d=await api(API+'/search?q='+encodeURIComponent(q));render(d.items);document.getElementById('sectionTitle').textContent='Hasil pencarian';document.getElementById('count').textContent=`${d.items.length} hasil`;document.getElementById('pages').innerHTML=''}catch(e){fail(e)}}
async function detail(t,id){document.getElementById('drawer').classList.add('open');document.getElementById('detail').innerHTML='<div class="loading">Memuat detail…</div>';try{const d=await api(`${API}/detail?type=${t}&id=${id}`);current=d.data;document.getElementById('backdrop').style.backgroundImage=current.backdrop?`url("${current.backdrop}")`:'';drawDetail()}catch(e){document.getElementById('detail').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function drawDetail(){const x=current;const seasons=x.seasons||[];document.getElementById('detail').innerHTML=`<div class="kicker">${esc(x.type)} · ${esc(x.year)}</div><h1>${esc(x.title)}</h1><div class="chips"><span class="chip">★ ${esc(x.rating||'-')}</span>${(x.genres||[]).map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div><p class="syn">${esc(x.synopsis||'Sinopsis tidak tersedia.')}</p>${seasons.length?`<h2>Season</h2><div class="seasons">${seasons.map((s,i)=>`<button class="season ${i===0?'active':''}" onclick="selectSeason(this,'${esc(s)}')">${esc(s)}</button>`).join('')}</div>`:''}<h2>Episode</h2><div class="episodes" id="episodes">${x.type==='tv'?(x.episodeCount?`<div class="notice" style="grid-column:1/-1">${esc(x.episodeCount)} episode tersedia di sumber. Pilih episode dari sumber resmi/berizin untuk pemutaran.</div>`:'<div class="notice" style="grid-column:1/-1">Daftar episode tersedia di halaman sumber.</div>'):'<button class="episode" onclick="openPlayer()"><strong>▶ Nonton</strong><span>Putar player VeloFlix di TLIBRARY</span></button>'}</div>${x.cast?.length?`<h2>Cast</h2><div class="cast">${x.cast.map(p=>`<div class="person"><img loading="lazy" src="${esc(p.image)}"><b>${esc(p.name)}</b><small>${esc(p.character||'')}</small></div>`).join('')}</div>`:''}<p class="source">Metadata source: <a href="${esc(x.source)}" target="_blank" rel="noopener">VeloFlix</a></p>`}
function selectSeason(btn,name){document.querySelectorAll('.season').forEach(x=>x.classList.remove('active'));btn.classList.add('active');showToast(name+' dipilih. Episode ditampilkan dari sumber saat endpoint season tersedia.')}
async function openPlayer(){
 const modal=document.getElementById('player'), video=document.getElementById('playerVideo'), frame=document.getElementById('playerFrame');
 modal.classList.add('open');
 video.removeAttribute('src');
 frame.removeAttribute('src');
 frame.srcdoc='';
 video.style.display='block'; frame.style.display='none';
 try{
   const d=await api(API+'/player?type='+encodeURIComponent(current.type)+'&id='+encodeURIComponent(current.id));
   if(d.mpdUrl){
     if(!window.dashjs) throw Error('DASH player belum termuat.');
     if(video.dashPlayer) video.dashPlayer.reset();
     video.dashPlayer=dashjs.MediaPlayer().create();
     video.dashPlayer.initialize(video,d.mpdUrl,false);
     return;
   }
   if(d.embedUrl){
     video.style.display='none'; frame.style.display='block'; frame.src=d.embedUrl;
     return;
   }
   throw Error('MPD/player publik tidak ditemukan.');
 }catch(e){
   video.style.display='none'; frame.style.display='block';
   frame.srcdoc='<div style="display:grid;place-items:center;height:100vh;background:#000;color:#aaa;font:15px system-ui;text-align:center;padding:20px">'+esc(e.message)+'</div>';
 }
}
function closePlayer(){
 const modal=document.getElementById('player'), video=document.getElementById('playerVideo'), frame=document.getElementById('playerFrame');
 if(video.dashPlayer){video.dashPlayer.reset();video.dashPlayer=null;}
 video.removeAttribute('src'); video.load();
 frame.removeAttribute('src'); frame.srcdoc='';
 modal.classList.remove('open');
}
function closeDetail(){document.getElementById('drawer').classList.remove('open')}
function fail(e){document.getElementById('grid').innerHTML='<div class="empty">Gagal memuat: '+esc(e.message)+'</div>'}
function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
home();
</script></body></html>
