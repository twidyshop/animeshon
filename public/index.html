<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animeshon - Streaming Anime Elegan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; scroll-behavior: smooth; }
        .card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.3);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #global-loader { transition: opacity 0.3s ease-in-out; }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white pb-20">

    <!-- Global Loader -->
    <div id="global-loader" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col justify-center items-center">
        <div class="loader-spin rounded-full h-14 w-14 border-t-2 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-blue-400 font-bold animate-pulse">Memuat Animeshon...</p>
    </div>

    <!-- Navbar -->
    <nav class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="#home" class="flex items-center">
                    <h1 class="text-2xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-600">ANIMESHON</h1>
                </a>
                <div class="hidden md:flex items-center space-x-6">
                    <a href="#home" class="text-blue-400 font-semibold text-sm nav-link" data-target="home">Beranda</a>
                    <a href="#jadwal" class="text-slate-400 hover:text-white text-sm nav-link" data-target="jadwal">Jadwal Rilis</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- App Container -->
    <main id="app-container" class="min-h-screen">
        <!-- Konten dimuat dinamis lewat JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-900 mt-12 py-8 text-center text-slate-500 text-sm">
        <p>&copy; 2026 Animeshon. Real-time API Connected.</p>
    </footer>

    <script>
        const PROXY_URL = '/api/proxy?endpoint=';
        const appContainer = document.getElementById('app-container');
        const globalLoader = document.getElementById('global-loader');

        function showLoader() { globalLoader.classList.remove('fade-out'); }
        function hideLoader() { globalLoader.classList.add('fade-out'); }

        // Fungsi pencari array cerdas di dalam JSON bertingkat apapun
        function findDataArray(obj) {
            if (Array.isArray(obj) && obj.length > 0) return obj;
            if (typeof obj === 'object' && obj !== null) {
                const keys = ['data', 'result', 'anime', 'latest', 'ongoing', 'list'];
                for (let k of keys) {
                    if (obj[k] && Array.isArray(obj[k]) && obj[k].length > 0) return obj[k];
                }
                for (let key in obj) {
                    if (Array.isArray(obj[key]) && obj[key].length > 0) return obj[key];
                    if (typeof obj[key] === 'object') {
                        let found = findDataArray(obj[key]);
                        if (found && found.length > 0) return found;
                    }
                }
            }
            return [];
        }

        // Router Utama
        async function router() {
            const hash = window.location.hash || '#home';
            showLoader();
            window.scrollTo(0, 0);

            try {
                if (hash === '#home' || hash === '') {
                    await renderHome();
                } else if (hash.startsWith('#detail/')) {
                    const slug = hash.replace('#detail/', '');
                    await renderDetail(slug);
                } else if (hash.startsWith('#episode/')) {
                    const slug = hash.replace('#episode/', '');
                    await renderWatch(slug);
                } else {
                    await renderHome();
                }
            } catch (err) {
                console.error(err);
                appContainer.innerHTML = `<div class="text-center py-20 text-red-400">Gagal memuat data dari API. Pastikan endpoint aktif.</div>`;
            } finally {
                hideLoader();
            }
        }

        // Halaman Beranda (Menarik data asli dari API Root / Home)
        async function renderHome() {
            // Kita tembak root endpoint '/' yang terbukti mengembalikan list anime di percobaan pertama Anda
            const res = await fetch(PROXY_URL + '/');
            const data = await res.json();
            const animeList = findDataArray(data);

            let html = `
                <header class="relative overflow-hidden bg-slate-900 py-16 mb-8 border-b border-slate-800">
                    <div class="max-w-7xl mx-auto px-4 text-center">
                        <h2 class="text-4xl font-extrabold text-white">Portal Anime <span class="text-blue-500">Premium</span></h2>
                        <p class="mt-2 text-slate-400">Streaming langsung dari database Animasu API.</p>
                    </div>
                </header>
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <h3 class="text-2xl font-bold border-l-4 border-blue-500 pl-3 mb-6">Update Terbaru</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            `;

            if (animeList.length === 0) {
                html += `<div class="col-span-full text-center text-slate-400 py-10">Tidak ada data anime ditemukan dari server.</div>`;
            } else {
                animeList.forEach(anime => {
                    const title = anime.title || anime.name || 'Unknown';
                    const image = anime.image || anime.thumbnail || anime.poster || 'https://via.placeholder.com/300x450';
                    const status = anime.status || anime.type || 'Ongoing';
                    const eps = anime.episode || anime.eps || '';
                    
                    // Ekstraksi ID/Slug secara dinamis agar bisa diklik menuju detail/episode
                    let linkId = anime.endpoint || anime.id || anime.slug || '';
                    if (!linkId) {
                        for (let k in anime) {
                            if (typeof anime[k] === 'string' && anime[k].includes('-')) {
                                linkId = anime[k]; break;
                            }
                        }
                    }

                    const isEpisode = linkId.includes('-episode-') || linkId.includes('-eps-');
                    const targetHash = isEpisode ? `#episode/${linkId}` : `#detail/${linkId}`;

                    html += `
                        <a href="${targetHash}" class="block bg-slate-800/50 rounded-xl overflow-hidden border border-slate-700/50 card-hover group">
                            <div class="relative aspect-[3/4] bg-slate-800">
                                <img src="${image}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute bottom-0 p-3 w-full flex justify-between items-end bg-gradient-to-t from-slate-900">
                                    <span class="px-2 py-0.5 bg-blue-600 text-white text-[10px] font-bold rounded">${status}</span>
                                    ${eps ? `<span class="px-2 py-0.5 bg-black/60 text-slate-200 text-[10px] rounded">${eps}</span>` : ''}
                                </div>
                            </div>
                            <div class="p-3">
                                <h4 class="font-bold text-sm line-clamp-2 text-slate-200 group-hover:text-blue-400">${title}</h4>
                            </div>
                        </a>
                    `;
                });
            }

            html += `</div></div>`;
            appContainer.innerHTML = html;
        }

        // Halaman Detail
        async function renderDetail(slug) {
            const res = await fetch(PROXY_URL + '/' + slug);
            const data = await res.json();
            const info = data.data || data.result || data || {};

            const title = info.title || 'Detail Anime';
            const image = info.image || info.thumbnail || '';
            const synopsis = info.synopsis || info.sinopsis || 'Tidak ada sinopsis.';
            const episodes = findDataArray(info.episode_list || info.episodes || info);

            let html = `
                <div class="max-w-5xl mx-auto px-4 py-8">
                    <a href="#home" class="inline-block text-slate-400 hover:text-white mb-6">&larr; Kembali ke Beranda</a>
                    <div class="flex flex-col md:flex-row gap-6 bg-slate-800/40 p-6 rounded-2xl border border-slate-700">
                        <img src="${image}" class="w-full md:w-1/3 rounded-xl object-cover aspect-[3/4]" alt="Cover">
                        <div class="flex-1">
                            <h1 class="text-2xl font-bold text-white mb-3">${title}</h1>
                            <p class="text-slate-400 text-sm mb-6">${synopsis}</p>
                            <h3 class="text-lg font-bold mb-3 border-b border-slate-700 pb-2">Daftar Episode</h3>
                            <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-60 overflow-y-auto">
            `;

            if (episodes.length > 0) {
                episodes.forEach(eps => {
                    let epSlug = eps.endpoint || eps.id || (slug + '-episode-' + (eps.episode || eps.eps));
                    let epTitle = eps.title || eps.episode || eps.eps || 'Eps';
                    html += `<a href="#episode/${epSlug}" class="py-2 bg-slate-800 hover:bg-blue-600 rounded text-center text-xs font-semibold border border-slate-700">${epTitle}</a>`;
                });
            } else {
                html += `<p class="text-slate-500 col-span-full">Episode belum tersedia.</p>`;
            }

            html += `</div></div></div></div>`;
            appContainer.innerHTML = html;
        }

        // Halaman Nonton / Player
        async function renderWatch(slug) {
            const res = await fetch(PROXY_URL + '/' + slug);
            const data = await res.json();
            const info = data.data || data.result || data || {};
            
            let streamUrl = info.stream_url || info.video || info.iframe || '';
            if (!streamUrl && info.server && info.server.length > 0) {
                streamUrl = info.server[0].url || info.server[0].iframe || '';
            }

            appContainer.innerHTML = `
                <div class="max-w-4xl mx-auto px-4 py-8">
                    <button onclick="window.history.back()" class="text-slate-400 hover:text-white mb-4">&larr; Kembali</button>
                    <h2 class="text-xl font-bold text-white mb-4">${info.title || 'Streaming'}</h2>
                    <div class="aspect-video bg-black rounded-xl overflow-hidden border border-slate-700 flex items-center justify-center">
                        ${streamUrl ? `<iframe src="${streamUrl}" class="w-full h-full" allowfullscreen="true" frameborder="0"></iframe>` : `<p class="text-slate-500">Video tidak tersedia dari server.</p>`}
                    </div>
                </div>
            `;
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', router);
    </script>
</body>
</html>
