<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animeshon - Streaming Anime Elegan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { 
            background-color: #0b0f19; /* Latar belakang gelap seperti referensi */
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth; 
        }
        
        /* Tema Warna Kustom */
        .bg-card { background-color: #1a1f2e; }
        .text-accent { color: #8b5cf6; } /* Ungu seperti tombol 'Tonton Sekarang' */
        .bg-accent { background-color: #8b5cf6; }
        .hover-bg-accent:hover { background-color: #7c3aed; }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #global-loader { transition: opacity 0.3s ease-in-out; }
        .fade-out { opacity: 0; pointer-events: none; }

        /* Gradasi Hero Section */
        .hero-gradient {
            background: linear-gradient(0deg, #0b0f19 0%, rgba(11, 15, 25, 0.7) 40%, rgba(11, 15, 25, 0.1) 100%);
        }
    </style>
</head>
<body class="antialiased selection:bg-purple-500 selection:text-white pb-10">

    <!-- Global Loader -->
    <div id="global-loader" class="fixed inset-0 bg-[#0b0f19] z-[100] flex flex-col justify-center items-center">
        <div class="loader-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-purple-500 mb-4"></div>
        <p class="text-purple-400 font-bold tracking-widest">ANIMESHON</p>
    </div>

    <!-- Navbar -->
    <nav class="bg-[#0b0f19]/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Menu Kiri -->
                <div class="flex items-center space-x-8">
                    <a href="#home" class="flex items-center space-x-2">
                        <i class="fas fa-play text-purple-500 text-xl"></i>
                        <h1 class="text-xl font-bold tracking-tight text-white">animeshon</h1>
                    </a>
                    
                    <div class="hidden lg:flex space-x-6">
                        <a href="#home" class="text-white font-medium text-sm flex items-center space-x-2 nav-link" data-target="home">
                            <i class="fas fa-home opacity-70"></i><span>Beranda</span>
                        </a>
                        <a href="#animelist" class="text-gray-400 hover:text-white font-medium text-sm transition-colors nav-link" data-target="animelist">Anime</a>
                        <a href="#jadwal" class="text-gray-400 hover:text-white font-medium text-sm transition-colors nav-link" data-target="jadwal">Jadwal</a>
                        <a href="#animelist" class="text-gray-400 hover:text-white font-medium text-sm transition-colors nav-link">Genre</a>
                    </div>
                </div>

                <!-- Search & Kanan -->
                <div class="hidden md:flex items-center space-x-6 flex-1 justify-end">
                    <form id="search-form" class="relative w-full max-w-md">
                        <i class="fas fa-search absolute left-3 top-2.5 text-gray-500 text-sm"></i>
                        <input type="text" id="search-input" placeholder="Cari anime, judul, atau genre..." class="w-full bg-[#1a1f2e] border border-gray-700 text-sm rounded-full pl-10 pr-4 py-2 focus:outline-none focus:border-purple-500 transition-all text-gray-300 placeholder-gray-500">
                    </form>
                    
                    <button class="text-gray-400 hover:text-white"><i class="far fa-bell text-lg"></i></button>
                    <div class="h-8 w-8 rounded-full bg-gray-700 overflow-hidden border border-gray-600">
                        <!-- Dummy Avatar -->
                        <img src="https://ui-avatars.com/api/?name=User&background=334155&color=fff" alt="User">
                    </div>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center gap-4">
                    <button id="mobile-search-btn" class="text-gray-400"><i class="fas fa-search"></i></button>
                    <button id="mobile-menu-btn" class="text-gray-400"><i class="fas fa-bars text-lg"></i></button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Search -->
        <div id="mobile-search-bar" class="hidden px-4 py-3 bg-[#1a1f2e] border-t border-gray-800">
            <form id="mobile-search-form" class="relative w-full">
                <input type="text" id="mobile-search-input" placeholder="Cari anime..." class="w-full bg-[#0b0f19] border border-gray-700 text-sm rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-purple-500">
                <i class="fas fa-search absolute left-3 top-2.5 text-gray-500"></i>
            </form>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-[#0b0f19] border-t border-gray-800">
            <a href="#home" class="block px-4 py-3 text-gray-400 hover:text-white nav-link" data-target="home">Beranda</a>
            <a href="#animelist" class="block px-4 py-3 text-gray-400 hover:text-white nav-link" data-target="animelist">Anime</a>
            <a href="#jadwal" class="block px-4 py-3 text-gray-400 hover:text-white nav-link" data-target="jadwal">Jadwal</a>
        </div>
    </nav>

    <!-- Kontainer Aplikasi Utama -->
    <div id="app-container" class="min-h-screen">
        <!-- Konten Dinamis -->
    </div>

    <!-- Footer -->
    <footer class="bg-[#0b0f19] border-t border-gray-800 mt-12 py-10">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-2 mb-4 md:mb-0">
                    <i class="fas fa-play text-purple-500 text-xl"></i>
                    <h1 class="text-xl font-bold tracking-tight text-white">animeshon</h1>
                </div>
                <div class="flex space-x-6 text-sm text-gray-400">
                    <a href="#" class="hover:text-white">Tentang Kami</a>
                    <a href="#" class="hover:text-white">FAQ</a>
                    <a href="#" class="hover:text-white">Syarat & Ketentuan</a>
                    <a href="#" class="hover:text-white">Kebijakan Privasi</a>
                </div>
                <div class="flex space-x-4 mt-4 md:mt-0 text-gray-400">
                    <a href="#" class="hover:text-white"><i class="fab fa-discord"></i></a>
                    <a href="#" class="hover:text-white"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="hover:text-white"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
            <div class="mt-8 text-center md:text-left text-xs text-gray-600 flex justify-between">
                <span>&copy; 2026 Animeshon. All rights reserved.</span>
                <span>Anime adalah hidup.</span>
            </div>
        </div>
    </footer>

    <!-- Script SPA -->
    <script>
        const BASE_PROXY = '/api/proxy?endpoint=';
        const API_HOME = '/animasu/home';
        const API_DETAIL = '/animasu/detail/';
        const API_EPISODE = '/animasu/episode/';
        const API_SCHEDULE = '/animasu/schedule';
        const API_SEARCH = '/animasu/search/';
        const API_ANIMELIST = '/animasu/animelist';

        const appContainer = document.getElementById('app-container');
        const globalLoader = document.getElementById('global-loader');

        function showLoader() { globalLoader.classList.remove('fade-out'); }
        function hideLoader() { globalLoader.classList.add('fade-out'); }

        const errorHTML = (msg) => `
            <div class="text-center py-32 px-4 max-w-[1400px] mx-auto">
                <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                <h3 class="text-xl font-bold text-white mb-2">Gagal Memuat Data</h3>
                <p class="text-gray-400 mb-6">${msg}</p>
                <button onclick="router()" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg transition-colors">Coba Lagi</button>
            </div>
        `;

        // Detektif Array Kuat
        function findDataArray(obj) {
            let foundArray = [];
            if (Array.isArray(obj) && obj.length > 0) return obj;
            if (typeof obj === 'object' && obj !== null) {
                const commonKeys = ['data', 'result', 'anime', 'popular', 'latest', 'ongoing', 'completed', 'movies', 'list'];
                for (let key of commonKeys) {
                     if (obj[key] && Array.isArray(obj[key]) && obj[key].length > 0) {
                         return obj[key];
                     }
                }
                for (let key in obj) {
                    if (Array.isArray(obj[key]) && obj[key].length > 0) {
                        return obj[key];
                    } else if (typeof obj[key] === 'object' && obj[key] !== null) {
                        let nestedFound = findDataArray(obj[key]);
                        if (nestedFound && nestedFound.length > 0) return nestedFound;
                    }
                }
            }
            return foundArray;
        }

        function extractId(anime) {
            let linkId = anime.param || anime.endpoint || anime.slug || anime.id || '';
            if(!linkId) {
                for(let key in anime) {
                    if(typeof anime[key] === 'string' && anime[key].includes('-')) {
                        linkId = anime[key]; break;
                    }
                }
            }
            return linkId;
        }

        // Generator Card Style (Seperti Referensi)
        function generateAnimeCards(animeList) {
            if (animeList.length === 0) return `<div class="col-span-full py-10 text-center text-gray-500">Tidak ada data.</div>`;
            
            return animeList.slice(0, 10).map(anime => {
                const title = anime.title || anime.name || 'Unknown Title';
                const image = anime.image || anime.thumbnail || anime.poster || 'https://via.placeholder.com/300x450';
                const status = anime.status || anime.type || 'Ongoing';
                const eps = anime.episode || anime.eps || '';
                const linkId = extractId(anime);
                const isEpisode = linkId.includes('-episode-') || linkId.includes('-eps-');
                const targetHash = isEpisode ? `#episode/${linkId}` : `#detail/${linkId}`;

                return `
                    <a href="${targetHash}" class="block group">
                        <div class="relative aspect-[3/4] rounded-lg overflow-hidden bg-[#1a1f2e] mb-2 border border-gray-800">
                            <img src="${image}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            ${eps ? `<div class="absolute top-2 left-2 bg-gray-900/80 text-white text-[10px] font-bold px-2 py-0.5 rounded backdrop-blur-sm border border-gray-700">EP ${eps.replace(/[^0-9]/g, '') || eps}</div>` : ''}
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                                <i class="fas fa-play-circle text-4xl text-white opacity-80"></i>
                            </div>
                        </div>
                        <h4 class="font-semibold text-sm leading-tight line-clamp-2 text-gray-200 group-hover:text-purple-400 transition-colors">${title}</h4>
                        <p class="text-xs text-gray-500 mt-1 line-clamp-1">Action, Adventure</p>
                    </a>
                `;
            }).join('');
        }
        
        // Trending Sidebar List (Seperti Referensi)
        function generateTrendingList(animeList) {
            return animeList.slice(0, 5).map((anime, index) => {
                const title = anime.title || anime.name || 'Unknown';
                const image = anime.image || anime.thumbnail || '';
                const linkId = extractId(anime);
                return `
                    <a href="#detail/${linkId}" class="flex items-center space-x-3 p-2 hover:bg-[#1a1f2e] rounded-lg transition-colors group">
                        <span class="text-gray-500 font-bold text-sm w-4">${index + 1}</span>
                        <img src="${image}" class="w-10 h-10 rounded object-cover" alt="thumb">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-semibold text-gray-200 truncate group-hover:text-purple-400">${title}</h4>
                            <p class="text-xs text-gray-500 truncate">Action, Fantasy</p>
                        </div>
                        <i class="fas fa-chevron-right text-xs text-gray-600"></i>
                    </a>
                `;
            }).join('');
        }

        async function router() {
            const hash = window.location.hash || '#home';
            showLoader();
            window.scrollTo(0, 0);

            document.getElementById('mobile-menu').classList.add('hidden');
            document.getElementById('mobile-search-bar').classList.add('hidden');

            try {
                if (hash === '#home') await renderHome();
                else if (hash.startsWith('#detail/')) await renderDetail(hash.replace('#detail/', ''));
                else if (hash.startsWith('#episode/')) await renderWatch(hash.replace('#episode/', ''));
                else if (hash === '#jadwal') await renderSchedule();
                else if (hash === '#animelist') await renderAnimeList();
                else if (hash.startsWith('#search/')) await renderSearch(hash.replace('#search/', ''));
                else await renderHome();
            } catch (error) {
                console.error("Fetch Error:", error);
                appContainer.innerHTML = errorHTML("Tidak dapat menghubungi server API Animasu. Pastikan endpoint aktif.");
            } finally {
                hideLoader();
            }
        }

        // RENDER BERANDA (Desain mirip screenshot referensi)
        async function renderHome() {
            // Ambil data (Untuk demo, kita pakai endpoint home, idealnya endpoint popular/latest dipisah)
            const res = await fetch(BASE_PROXY + API_HOME);
            const data = await res.json();
            const animeList = findDataArray(data);
            
            // Simulasi pembagian data untuk UI
            const heroAnime = animeList[0] || {};
            const latestAnime = animeList.slice(0, 10);
            const popularAnime = animeList.slice(10, 20).length > 0 ? animeList.slice(10, 20) : animeList.slice(0, 10);
            
            const heroTitle = heroAnime.title || 'Jujutsu Kaisen';
            const heroImage = heroAnime.image || 'https://via.placeholder.com/1200x600?text=Hero+Image';
            const heroId = extractId(heroAnime);

            appContainer.innerHTML = `
                <!-- Hero Section -->
                <div class="relative w-full h-[60vh] md:h-[70vh] min-h-[400px] overflow-hidden">
                    <img src="${heroImage}" class="absolute inset-0 w-full h-full object-cover object-top opacity-50" alt="Hero">
                    <div class="absolute inset-0 hero-gradient"></div>
                    
                    <div class="absolute inset-0 flex items-center">
                        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 w-full pt-20">
                            <span class="text-purple-400 font-bold text-xs tracking-widest uppercase mb-2 block">Anime Populer</span>
                            <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-4 max-w-2xl leading-tight">${heroTitle}</h1>
                            <p class="text-gray-300 text-sm md:text-base max-w-xl mb-6 line-clamp-3">
                                Yuji Itadori, seorang siswa SMA yang memiliki kekuatan supernatural, bergabung dengan organisasi rahasia untuk menghadapi kutukan berbahaya yang mengancam dunia.
                            </p>
                            
                            <div class="flex items-center space-x-4 mb-8 text-xs text-gray-400 font-medium">
                                <span>Action</span>
                                <span>Supernatural</span>
                                <span>Shounen</span>
                                <span class="flex items-center text-yellow-400"><i class="fas fa-star mr-1"></i> 8.7 <span class="text-gray-500 ml-1">(1.2M)</span></span>
                            </div>

                            <div class="flex space-x-4">
                                <a href="#detail/${heroId}" class="px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded flex items-center transition-colors shadow-lg shadow-purple-500/30">
                                    <i class="fas fa-play mr-2"></i> Tonton Sekarang
                                </a>
                                <button class="px-6 py-2.5 bg-transparent border border-gray-500 hover:border-white text-white font-semibold rounded flex items-center transition-colors">
                                    <i class="fas fa-plus mr-2"></i> Daftar Saya
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Kategori Cepat -->
                <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 -mt-8 relative z-10 hidden md:block">
                    <div class="flex items-center justify-between bg-[#1a1f2e] p-4 rounded-xl border border-gray-800 shadow-xl overflow-x-auto">
                        ${['Semua', 'Action', 'Adventure', 'Comedy', 'Drama', 'Fantasy', 'Harem', 'Mystery', 'Romance', 'Sci-Fi', 'Sports', 'Supernatural'].map((genre, i) => `
                            <div class="flex flex-col items-center min-w-[80px] cursor-pointer group">
                                <div class="w-10 h-10 rounded-lg ${i===0 ? 'bg-purple-600/20 text-purple-500' : 'bg-gray-800 text-gray-400 group-hover:bg-gray-700'} flex items-center justify-center mb-2 transition-colors">
                                    <i class="fas fa-${['th-large', 'fire', 'compass', 'laugh', 'theater-masks', 'dragon', 'heart', 'search', 'kiss-wink-heart', 'robot', 'basketball-ball', 'ghost'][i]}"></i>
                                </div>
                                <span class="text-[10px] text-gray-400 font-medium">${genre}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Main Content Layout -->
                <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col lg:flex-row gap-8">
                    
                    <!-- Kiri: Grid Content -->
                    <div class="flex-1 w-full">
                        <!-- Anime Terbaru -->
                        <div class="mb-10">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-bold text-white">Anime Terbaru</h2>
                                <a href="#animelist" class="text-sm text-gray-400 hover:text-white flex items-center">Lihat Semua <i class="fas fa-arrow-right ml-1 text-xs"></i></a>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                ${generateAnimeCards(latestAnime)}
                            </div>
                        </div>

                        <!-- Anime Populer -->
                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-bold text-white">Anime Populer</h2>
                                <a href="#animelist" class="text-sm text-gray-400 hover:text-white flex items-center">Lihat Semua <i class="fas fa-arrow-right ml-1 text-xs"></i></a>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                ${generateAnimeCards(popularAnime)}
                            </div>
                        </div>
                    </div>

                    <!-- Kanan: Sidebar -->
                    <div class="w-full lg:w-80 flex-shrink-0 space-y-8">
                        
                        <!-- Trending -->
                        <div class="bg-[#0b0f19] rounded-xl">
                            <h3 class="text-sm font-bold text-white mb-4 flex items-center"><i class="fas fa-fire text-purple-500 mr-2"></i> Trending Saat Ini</h3>
                            <div class="space-y-1">
                                ${generateTrendingList(animeList)}
                            </div>
                        </div>

                        <!-- Continue Watching Box -->
                        <div class="bg-[#0b0f19] rounded-xl pt-4 border-t border-gray-800">
                            <h3 class="text-sm font-bold text-white mb-4 flex items-center"><i class="fas fa-play-circle text-gray-400 mr-2"></i> Lanjut Nonton</h3>
                            <div class="flex items-center space-x-3 p-3 bg-[#1a1f2e] rounded-lg border border-gray-800 hover:border-gray-600 cursor-pointer transition-colors">
                                <img src="${heroImage}" class="w-12 h-12 rounded object-cover" alt="thumb">
                                <div class="flex-1 min-w-0">
                                    <h4 class="text-sm font-semibold text-gray-200 truncate">${heroTitle}</h4>
                                    <p class="text-xs text-gray-500">Episode 7 • 18:24</p>
                                    <div class="w-full bg-gray-700 h-1 mt-2 rounded-full overflow-hidden">
                                        <div class="bg-purple-500 h-full w-2/3"></div>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-right text-xs text-gray-600"></i>
                            </div>
                        </div>

                        <!-- Premium Banner -->
                        <div class="bg-gradient-to-br from-[#1a1f2e] to-[#2d1b4e] rounded-xl p-5 border border-purple-900/50 shadow-lg">
                            <i class="fas fa-crown text-purple-400 mb-2 text-xl"></i>
                            <h4 class="text-white font-bold text-sm mb-1">Nikmati Pengalaman Menonton Tanpa Batas</h4>
                            <p class="text-xs text-gray-400 mb-4">Dapatkan akses premium untuk kualitas HD, tanpa iklan, dan lebih banyak fitur menarik lainnya.</p>
                            <button class="w-full py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded transition-colors flex items-center justify-center">
                                Upgrade ke Premium <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>

                    </div>
                </div>
            `;
        }

        // RENDER DETAIL ANIME
        async function renderDetail(slug) {
            const res = await fetch(BASE_PROXY + API_DETAIL + slug);
            const data = await res.json();
            const info = data.data || data.result || data || {};
            
            const title = info.title || 'Detail Anime';
            const image = info.image || info.thumbnail || 'https://via.placeholder.com/300x450';
            const synopsis = info.synopsis || info.sinopsis || '-';
            let episodes = info.episode_list || info.episodes || findDataArray(info);

            let html = `
                <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    <button onclick="window.history.back()" class="text-gray-400 hover:text-white mb-6 text-sm flex items-center"><i class="fas fa-arrow-left mr-2"></i> Kembali</button>
                    
                    <div class="flex flex-col md:flex-row gap-8 bg-[#1a1f2e] p-6 rounded-xl border border-gray-800">
                        <div class="w-full md:w-64 flex-shrink-0">
                            <img src="${image}" class="w-full rounded-lg shadow-lg border border-gray-700" alt="${title}">
                        </div>
                        <div class="flex-1">
                            <h1 class="text-3xl font-bold text-white mb-2">${title}</h1>
                            <div class="flex items-center space-x-3 text-xs text-gray-400 mb-6">
                                <span class="bg-gray-800 px-2 py-1 rounded">${info.status || 'Ongoing'}</span>
                                <span class="flex items-center text-yellow-400"><i class="fas fa-star mr-1"></i> ${info.score || '-'}</span>
                            </div>
                            
                            <h3 class="text-sm font-bold text-white mb-2">Sinopsis</h3>
                            <p class="text-sm text-gray-400 leading-relaxed mb-8">${synopsis}</p>
                            
                            <h3 class="text-sm font-bold text-white mb-4 border-b border-gray-800 pb-2">Daftar Episode</h3>
                            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 gap-2 max-h-64 overflow-y-auto pr-2 custom-scrollbar">
            `;

            if(episodes.length > 0) {
                episodes.forEach(eps => {
                    let epsEndpoint = extractId(eps) || (slug + '-episode-' + (eps.episode || eps.eps));
                    let epsTitle = eps.title || eps.episode || eps.eps || '?';
                    if (!epsTitle.toString().toLowerCase().includes('eps')) epsTitle = 'EP ' + epsTitle;
                    
                    html += `<a href="#episode/${epsEndpoint}" class="py-2 px-1 text-center bg-gray-800 hover:bg-purple-600 text-gray-300 hover:text-white rounded text-xs font-semibold transition-colors border border-gray-700">${epsTitle}</a>`;
                });
            } else {
                html += `<p class="text-gray-500 text-sm col-span-full">Episode belum tersedia.</p>`;
            }

            html += `</div></div></div></div>`;
            appContainer.innerHTML = html;
        }

        // RENDER STREAMING PLAYER
        async function renderWatch(slug) {
            const res = await fetch(BASE_PROXY + API_EPISODE + slug);
            const data = await res.json();
            const info = data.data || data.result || data || {};
            
            let streamUrl = info.stream_url || info.video || info.iframe || info.link || '';
            if(!streamUrl && info.server && Array.isArray(info.server) && info.server.length > 0) {
                streamUrl = info.server[0].url || info.server[0].iframe || info.server[0].link || '';
            }

            appContainer.innerHTML = `
                <div class="max-w-[1000px] mx-auto px-4 py-8">
                    <button onclick="window.history.back()" class="text-gray-400 hover:text-white mb-4 text-sm flex items-center"><i class="fas fa-arrow-left mr-2"></i> Kembali</button>
                    <h2 class="text-xl font-bold text-white mb-4">${info.title || 'Streaming Anime'}</h2>
                    
                    <div class="aspect-video bg-black rounded-lg overflow-hidden border border-gray-800 flex items-center justify-center">
                        ${streamUrl ? `<iframe src="${streamUrl}" class="w-full h-full" allowfullscreen="true" frameborder="0"></iframe>` : `<div class="text-gray-500"><i class="fas fa-video-slash text-3xl mb-2 block text-center"></i>Video tidak tersedia</div>`}
                    </div>
                    
                    <div class="mt-4 flex justify-between">
                        ${info.prev ? `<a href="#episode/${info.prev}" class="px-4 py-2 bg-[#1a1f2e] hover:bg-gray-800 text-sm rounded text-white border border-gray-800 transition-colors">Prev</a>` : `<div></div>`}
                        ${info.all ? `<a href="#detail/${info.all}" class="px-4 py-2 bg-[#1a1f2e] hover:bg-gray-800 text-sm rounded text-white border border-gray-800 transition-colors"><i class="fas fa-list"></i></a>` : `<div></div>`}
                        ${info.next ? `<a href="#episode/${info.next}" class="px-4 py-2 bg-[#1a1f2e] hover:bg-gray-800 text-sm rounded text-white border border-gray-800 transition-colors">Next</a>` : `<div></div>`}
                    </div>
                </div>
            `;
        }

        // RENDER PENCARIAN & DAFTAR (Reusable Grid)
        async function renderList(endpoint, titleText) {
            const res = await fetch(BASE_PROXY + endpoint);
            const data = await res.json();
            const animeList = findDataArray(data);

            appContainer.innerHTML = `
                <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    <h2 class="text-2xl font-bold text-white mb-6">${titleText}</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                        ${generateAnimeCards(animeList)}
                    </div>
                </div>
            `;
        }
        
        async function renderAnimeList() { await renderList(API_ANIMELIST, "Daftar Semua Anime"); }
        async function renderSchedule() { await renderList(API_SCHEDULE, "Jadwal Rilis Mingguan"); } // Fallback jika struktur jadwal sama
        async function renderSearch(keyword) { await renderList(API_SEARCH + encodeURIComponent(keyword), `Hasil Pencarian: "${decodeURIComponent(keyword)}"`); }

        // Event Listeners
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('search-input').value.trim();
            if(val) window.location.hash = `#search/${val}`;
        });
        document.getElementById('mobile-search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('mobile-search-input').value.trim();
            if(val) window.location.hash = `#search/${val}`;
        });
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
        document.getElementById('mobile-search-btn').addEventListener('click', () => {
            document.getElementById('mobile-search-bar').classList.toggle('hidden');
        });

        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', router);
    </script>
</body>
</html>
